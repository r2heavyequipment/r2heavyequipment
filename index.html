<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R2 Heavy Equipment | Rental Alat Berat Indonesia</title>

<meta name="description" content="R2 Heavy Equipment adalah partner penyedia dan penghubung rental alat berat untuk kebutuhan konstruksi, pertambangan, hauling, earthwork dan proyek di Indonesia.">

<meta name="keywords" content="rental alat berat, sewa excavator, sewa dump truck, sewa crane, heavy equipment Indonesia">

<meta name="theme-color" content="#0b0d0f">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --black:#07090b;
    --dark:#0d1013;
    --dark2:#15191d;
    --yellow:#f5b800;
    --yellow2:#ffc928;
    --white:#ffffff;
    --text:#15181b;
    --gray:#70777e;
    --light:#f4f5f6;
    --border:#e4e7e9;
    --green:#25D366;
}

html{
    scroll-padding-top:80px;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    background:var(--light);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

.container{
    width:min(1180px,calc(100% - 40px));
    margin:auto;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:78px;
    z-index:9999;

    background:rgba(7,9,11,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-link{
    display:flex;
    align-items:center;
    gap:13px;
    color:white;
}

.logo-img{
    width:72px;
    height:58px;
    object-fit:contain;
    display:block;
}

.logo-text{
    font-size:15px;
    font-weight:900;
    letter-spacing:.5px;
    white-space:nowrap;
}

.logo-text small{
    display:block;
    color:#858c92;
    font-size:8px;
    letter-spacing:1.7px;
    margin-top:1px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:27px;
}

.nav-links a{
    color:#d8dcdf;
    font-size:13px;
    font-weight:600;
    transition:.25s;
}

.nav-links a:hover{
    color:var(--yellow);
}

.nav-cta{
    background:var(--yellow);
    color:#111 !important;
    padding:11px 18px;
    border-radius:7px;
    font-weight:800 !important;
}

.nav-cta:hover{
    background:var(--yellow2);
}

.menu-btn{
    display:none;

    width:42px;
    height:42px;

    border:1px solid rgba(255,255,255,.14);
    border-radius:8px;

    background:transparent;
    color:white;

    font-size:22px;
    cursor:pointer;
}


/* =====================================================
   MOBILE MENU
===================================================== */

.mobile-menu{
    display:none;

    background:#0b0d0f;

    border-top:1px solid rgba(255,255,255,.06);

    padding:12px 20px 20px;
}

.mobile-menu a{
    display:block;

    padding:13px 0;

    color:#ddd;

    font-size:13px;

    border-bottom:1px solid rgba(255,255,255,.06);
}

.mobile-menu .mobile-cta{
    margin-top:12px;

    background:var(--yellow);
    color:#111;

    text-align:center;

    border-radius:7px;

    font-weight:800;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:880px;

    position:relative;

    display:flex;
    align-items:center;

    padding:145px 0 90px;

    color:white;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 80% 35%,
            rgba(245,184,0,.15),
            transparent 28%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(255,255,255,.04),
            transparent 25%
        ),
        linear-gradient(
            115deg,
            #050708 0%,
            #0c1013 55%,
            #171c20 100%
        );
}

.hero::before{
    content:"";

    position:absolute;

    width:650px;
    height:650px;

    right:-280px;
    top:100px;

    border-radius:50%;

    border:1px solid rgba(245,184,0,.09);
}

.hero::after{
    content:"";

    position:absolute;

    width:440px;
    height:440px;

    right:-170px;
    top:205px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.04);
}

.hero-grid{
    position:relative;
    z-index:2;

    display:grid;

    grid-template-columns:
        1.05fr
        .95fr;

    align-items:center;

    gap:65px;
}

.hero-label{
    display:inline-flex;
    align-items:center;

    gap:10px;

    color:var(--yellow);

    font-size:11px;
    font-weight:900;

    letter-spacing:2.2px;

    text-transform:uppercase;

    margin-bottom:23px;
}

.hero-label::before{
    content:"";

    width:38px;
    height:2px;

    background:var(--yellow);
}

.hero h1{
    font-size:
        clamp(46px,6vw,78px);

    line-height:1.01;

    letter-spacing:-3.5px;

    max-width:760px;

    margin-bottom:25px;
}

.hero h1 span{
    display:block;

    color:var(--yellow);
}

.hero-desc{
    max-width:650px;

    color:#b5bdc3;

    font-size:17px;

    line-height:1.8;

    margin-bottom:35px;
}

.hero-buttons{
    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.btn{
    min-height:51px;

    padding:0 22px;

    border-radius:8px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    font-size:13px;

    font-weight:800;

    transition:.25s;
}

.btn-primary{
    background:var(--yellow);
    color:#111;
}

.btn-primary:hover{
    background:var(--yellow2);
    transform:translateY(-2px);
}

.btn-secondary{
    border:1px solid #4d545a;
    color:white;
}

.btn-secondary:hover{
    border-color:var(--yellow);
    color:var(--yellow);
}

.hero-numbers{
    display:flex;

    gap:45px;

    margin-top:65px;

    flex-wrap:wrap;
}

.number-item strong{
    display:block;

    color:white;

    font-size:28px;
    line-height:1.1;
}

.number-item span{
    display:block;

    color:#707980;

    font-size:11px;

    margin-top:4px;
}


/* =====================================================
   HERO VISUAL
===================================================== */

.hero-visual{
    min-height:500px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;
}

.visual-box{
    width:100%;
    min-height:455px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.012)
        );

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 35px 90px rgba(0,0,0,.38);
}

.visual-box::before{
    content:"";

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(245,184,0,.16),
            rgba(245,184,0,.02),
            transparent 70%
        );
}

.visual-logo{
    position:relative;
    z-index:2;

    width:min(360px,75%);

    max-height:280px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 35px rgba(0,0,0,.5)
        );
}

.visual-text{
    position:absolute;

    top:25px;
    left:25px;

    color:#858d93;

    font-size:10px;

    letter-spacing:2px;

    font-weight:800;

    z-index:3;
}

.visual-badge{
    position:absolute;

    left:23px;
    bottom:23px;

    z-index:3;

    padding:12px 16px;

    border-radius:9px;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.1);

    color:white;

    font-size:11px;

    font-weight:700;
}

.visual-badge span{
    color:var(--yellow);
}


/* =====================================================
   GENERAL SECTION
===================================================== */

section{
    padding:100px 0;
}

.section-top{
    margin-bottom:45px;
}

.eyebrow{
    color:#a37a00;

    font-size:11px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:9px;
}

.section-title{
    font-size:
        clamp(32px,4vw,49px);

    line-height:1.12;

    letter-spacing:-1.7px;

    margin-bottom:13px;
}

.section-desc{
    color:var(--gray);

    max-width:680px;

    font-size:15px;
}


/* =====================================================
   SERVICES
===================================================== */

.services{
    background:white;
}

.service-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;
}

.service-card{
    padding:30px 24px;

    border:1px solid var(--border);

    border-radius:15px;

    background:white;

    transition:.3s;
}

.service-card:hover{
    transform:translateY(-7px);

    border-color:var(--yellow);

    box-shadow:
        0 20px 45px rgba(0,0,0,.08);
}

.service-icon{
    width:56px;
    height:56px;

    border-radius:12px;

    background:#fff5d5;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:25px;

    margin-bottom:20px;
}

.service-card h3{
    font-size:18px;

    margin-bottom:7px;
}

.service-card p{
    color:#7a8187;

    font-size:13px;
}


/* =====================================================
   UNIT
===================================================== */

.units{
    background:#f4f5f6;
}

.unit-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:22px;
}

.unit-card{
    background:white;

    border-radius:16px;

    overflow:hidden;

    border:1px solid #e1e4e6;

    transition:.3s;
}

.unit-card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.10);
}

.unit-top{
    height:225px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:76px;

    background:
        radial-gradient(
            circle at center,
            rgba(245,184,0,.13),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            #282e33,
            #0c0f11
        );
}

.unit-body{
    padding:24px;
}

.unit-category{
    color:#a17a00;

    font-size:10px;

    letter-spacing:1.5px;

    text-transform:uppercase;

    font-weight:900;
}

.unit-body h3{
    font-size:21px;

    margin:5px 0 8px;
}

.unit-body p{
    color:#777e84;

    font-size:13px;

    min-height:62px;

    margin-bottom:20px;
}

.unit-btn{
    width:100%;

    min-height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:#111315;

    color:white;

    font-size:12px;

    font-weight:800;

    transition:.25s;
}

.unit-btn:hover{
    background:var(--yellow);

    color:#111;
}


/* =====================================================
   ABOUT
===================================================== */

.about{
    background:white;
}

.about-grid{
    display:grid;

    grid-template-columns:
        .95fr
        1.05fr;

    gap:70px;

    align-items:center;
}

.about-card{
    min-height:450px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:22px;

    background:
        radial-gradient(
            circle at 70% 30%,
            rgba(245,184,0,.16),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #171b1f,
            #080a0c
        );
}

.about-card::after{
    content:"R2";

    position:absolute;

    right:-25px;
    bottom:-75px;

    font-size:220px;

    line-height:1;

    font-weight:900;

    color:rgba(255,255,255,.025);
}

.about-logo{
    width:68%;

    max-height:280px;

    object-fit:contain;

    position:relative;

    z-index:2;
}

.about-content h2{
    font-size:
        clamp(32px,4vw,49px);

    line-height:1.12;

    letter-spacing:-1.7px;

    margin-bottom:18px;
}

.about-content h2 span{
    color:#bd8c00;
}

.about-content p{
    color:#71777d;

    font-size:15px;

    margin-bottom:16px;
}

.about-list{
    display:grid;

    gap:13px;

    margin-top:25px;
}

.about-list div{
    display:flex;

    align-items:center;

    gap:11px;

    font-size:13px;

    font-weight:700;
}

.check{
    width:24px;
    height:24px;

    flex:none;

    border-radius:50%;

    background:#fff2c5;

    color:#9b7400;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:12px;
}


/* =====================================================
   WHY R2
===================================================== */

.why{
    background:#101315;

    color:white;
}

.why .section-title{
    color:white;
}

.why .section-desc{
    color:#858c92;
}

.why-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-top:45px;
}

.why-card{
    padding:30px;

    border:1px solid rgba(255,255,255,.09);

    border-radius:15px;

    background:rgba(255,255,255,.025);

    transition:.3s;
}

.why-card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(245,184,0,.4);
}

.why-number{
    color:var(--yellow);

    font-size:12px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:25px;
}

.why-card h3{
    font-size:19px;

    margin-bottom:9px;
}

.why-card p{
    color:#8d949a;

    font-size:13px;
}


/* =====================================================
   PROCESS
===================================================== */

.process{
    background:#f4f5f6;
}

.process-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;
}

.process-card{
    background:white;

    padding:30px 23px;

    border-radius:13px;

    border:1px solid var(--border);

    transition:.3s;
}

.process-card:hover{
    transform:translateY(-5px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.07);
}

.process-number{
    font-size:35px;

    font-weight:900;

    color:var(--yellow);

    margin-bottom:15px;
}

.process-card h3{
    font-size:17px;

    margin-bottom:7px;
}

.process-card p{
    color:#777d82;

    font-size:13px;
}


/* =====================================================
   COVERAGE
===================================================== */

.coverage{
    background:white;
}

.coverage-box{
    border-radius:20px;

    padding:55px;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            120deg,
            rgba(245,184,0,.10),
            transparent 50%
        ),
        #111416;

    color:white;
}

.coverage-box::after{
    content:"INDONESIA";

    position:absolute;

    right:-20px;
    bottom:-30px;

    font-size:85px;

    font-weight:900;

    color:rgba(255,255,255,.035);
}

.coverage-box h2{
    position:relative;
    z-index:2;

    font-size:38px;

    margin-bottom:12px;
}

.coverage-box p{
    position:relative;
    z-index:2;

    color:#969da3;

    max-width:650px;

    font-size:14px;
}

.location-list{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:25px;

    position:relative;

    z-index:2;
}

.location-list span{
    padding:8px 13px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:30px;

    color:#c7ccd0;

    font-size:11px;
}


/* =====================================================
   CTA
===================================================== */

.cta{
    padding:100px 0;

    background:
        radial-gradient(
            circle at center,
            rgba(245,184,0,.13),
            transparent 40%
        ),
        #080a0c;

    color:white;

    text-align:center;
}

.cta h2{
    font-size:
        clamp(34px,5vw,59px);

    line-height:1.08;

    letter-spacing:-2px;

    margin-bottom:17px;
}

.cta h2 span{
    color:var(--yellow);
}

.cta p{
    color:#858d93;

    max-width:620px;

    margin:0 auto 30px;

    font-size:14px;
}

.cta-buttons{
    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    background:#050607;

    color:white;

    padding:60px 0 25px;
}

.footer-grid{
    display:grid;

    grid-template-columns:
        1.7fr
        1fr
        1fr;

    gap:60px;

    padding-bottom:45px;
}

.footer-logo{
    width:145px;
    height:75px;

    object-fit:contain;

    object-position:left center;

    margin-bottom:12px;
}

.footer-brand p{
    max-width:390px;

    color:#70777d;

    font-size:13px;
}

footer h3{
    font-size:14px;

    margin-bottom:18px;
}

footer a{
    display:block;

    color:#747b81;

    font-size:12px;

    margin-bottom:9px;

    transition:.2s;
}

footer a:hover{
    color:var(--yellow);
}

.footer-bottom{
    border-top:1px solid #1c2023;

    padding-top:20px;

    color:#565d62;

    font-size:10px;

    display:flex;

    justify-content:space-between;

    gap:20px;

    flex-wrap:wrap;
}


/* =====================================================
   FLOATING WHATSAPP
===================================================== */

.floating-wa{
    position:fixed;

    right:20px;
    bottom:20px;

    width:58px;
    height:58px;

    border-radius:50%;

    background:var(--green);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:26px;

    z-index:9998;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    transition:.25s;
}

.floating-wa:hover{
    transform:scale(1.08);
}


/* =====================================================
   RESPONSIVE TABLET
===================================================== */

@media(max-width:950px){

    .nav-links{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .hero-grid{
        grid-template-columns:1fr;
    }

    .hero-visual{
        display:none;
    }

    .hero{
        min-height:780px;
    }

    .service-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .unit-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .about-grid{
        grid-template-columns:1fr;

        gap:40px;
    }

    .why-grid{
        grid-template-columns:1fr;
    }

    .process-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}


/* =====================================================
   RESPONSIVE MOBILE
===================================================== */

@media(max-width:600px){

    .container{
        width:min(
            calc(100% - 30px),
            1180px
        );
    }

    .navbar{
        height:68px;
    }

    .nav-inner{
        height:68px;
    }

    .logo-img{
        width:58px;
        height:48px;
    }

    .logo-text{
        font-size:12px;
    }

    .logo-text small{
        font-size:7px;
        letter-spacing:1.1px;
    }

    .hero{
        min-height:750px;

        padding:120px 0 65px;
    }

    .hero h1{
        font-size:44px;

        letter-spacing:-2px;
    }

    .hero-desc{
        font-size:14px;

        line-height:1.7;
    }

    .hero-numbers{
        gap:25px;

        margin-top:50px;
    }

    section{
        padding:70px 0;
    }

    .service-grid,
    .unit-grid,
    .process-grid{
        grid-template-columns:1fr;
    }

    .service-card{
        padding:25px 20px;
    }

    .unit-top{
        height:190px;
    }

    .about-card{
        min-height:330px;
    }

    .coverage-box{
        padding:32px 25px;
    }

    .coverage-box h2{
        font-size:29px;
    }

    .coverage-box::after{
        font-size:45px;
    }

    .footer-
