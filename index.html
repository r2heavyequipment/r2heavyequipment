<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    R2 Heavy Equipment | Rental & Project Support
  </title>

  <meta
    name="description"
    content="R2 Heavy Equipment adalah partner kebutuhan alat berat untuk proyek konstruksi, pertambangan, hauling dan pekerjaan lainnya di Indonesia."
  >

  <meta
    name="keywords"
    content="R2 Heavy Equipment, rental alat berat, sewa excavator, sewa dump truck, sewa crane, sewa wheel loader, project support"
  >

  <meta
    name="author"
    content="R2 Heavy Equipment"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f6f7;
      color: #17191b;

      line-height: 1.6;

      overflow-x: hidden;
    }

    img {
      max-width: 100%;
    }

    a {
      text-decoration: none;
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {

      --black: #0c0e0f;
      --dark: #111315;
      --dark2: #181b1e;

      --yellow: #f5b800;
      --yellow-light: #ffc928;

      --white: #ffffff;

      --gray: #858b91;
      --gray-light: #e9ebed;

      --section: #f5f6f7;

      --container: 1180px;

      --radius: 16px;

      --shadow:
        0 20px 50px rgba(0,0,0,.08);
    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {

      width: min(
        calc(100% - 40px),
        var(--container)
      );

      margin: auto;
    }


    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      z-index: 9999;

      background:
        rgba(12,14,15,.92);

      backdrop-filter:
        blur(15px);

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }


    .nav-inner {

      height: 78px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    /* LOGO */

    .nav-brand {

      display: flex;

      align-items: center;

      gap: 13px;

      color: white;
    }


    .nav-logo {

      width: 55px;
      height: 55px;

      object-fit: contain;

      display: block;
    }


    .brand-text {

      font-size: 17px;

      font-weight: 800;

      letter-spacing: .4px;
    }


    .brand-text small {

      display: block;

      margin-top: -2px;

      font-size: 8px;

      color: #999fa4;

      letter-spacing: 1.8px;
    }


    /* MENU */

    .nav-menu {

      display: flex;

      align-items: center;

      gap: 32px;
    }


    .nav-menu a {

      color: #d9dcde;

      font-size: 13px;

      font-weight: 600;

      transition: .25s;
    }


    .nav-menu a:hover {

      color: var(--yellow);
    }


    .nav-contact {

      background: var(--yellow);

      color: #111 !important;

      padding:
        11px 18px;

      border-radius: 8px;

      font-weight: 800 !important;
    }


    .nav-contact:hover {

      background:
        var(--yellow-light);

      transform:
        translateY(-2px);
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      min-height: 850px;

      padding:
        170px 0 100px;

      position: relative;

      display: flex;

      align-items: center;

      overflow: hidden;

      color: white;

      background:

        radial-gradient(
          circle at 80% 40%,
          rgba(245,184,0,.16),
          transparent 30%
        ),

        linear-gradient(
          110deg,
          #090a0b 0%,
          #111416 55%,
          #1b1e21 100%
        );
    }


    .hero::before {

      content: "";

      position: absolute;

      width: 700px;
      height: 700px;

      right: -350px;
      bottom: -350px;

      border-radius: 50%;

      border:
        1px solid rgba(245,184,0,.15);

      box-shadow:
        0 0 0 80px rgba(245,184,0,.025),
        0 0 0 160px rgba(245,184,0,.018);
    }


    .hero-grid {

      display: grid;

      grid-template-columns:
        1.1fr .9fr;

      gap: 60px;

      align-items: center;

      position: relative;

      z-index: 2;
    }


    .hero-label {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      color: var(--yellow);

      font-size: 12px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 22px;
    }


    .hero-label::before {

      content: "";

      width: 35px;
      height: 2px;

      background:
        var(--yellow);
    }


    .hero h1 {

      font-size:
        clamp(44px, 6vw, 76px);

      line-height: 1.02;

      letter-spacing: -3px;

      margin-bottom: 25px;
    }


    .hero h1 span {

      color: var(--yellow);
    }


    .hero-description {

      max-width: 650px;

      color: #b9bec3;

      font-size: 17px;

      line-height: 1.8;

      margin-bottom: 35px;
    }


    .hero-buttons {

      display: flex;

      gap: 13px;

      flex-wrap: wrap;
    }


    .btn {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 50px;

      padding:
        0 23px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: 800;

      transition: .25s;
    }


    .btn-primary {

      background:
        var(--yellow);

      color: #111;
    }


    .btn-primary:hover {

      background:
        var(--yellow-light);

      transform:
        translateY(-3px);

      box-shadow:
        0 12px 30px rgba(245,184,0,.18);
    }


    .btn-dark-outline {

      border:
        1px solid rgba(255,255,255,.2);

      color: white;
    }


    .btn-dark-outline:hover {

      border-color:
        var(--yellow);

      color:
        var(--yellow);
    }


    /* HERO LOGO BESAR */

    .hero-visual {

      min-height: 450px;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;
    }


    .hero-logo-box {

      width: 390px;
      height: 390px;

      border-radius: 35px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid rgba(255,255,255,.1);

      box-shadow:
        0 40px 100px rgba(0,0,0,.35);

      position: relative;

      backdrop-filter:
        blur(10px);
    }


    .hero-logo-box::before {

      content: "";

      position: absolute;

      inset: 18px;

      border:
        1px solid rgba(245,184,0,.18);

      border-radius: 25px;
    }


    .hero-logo {

      width: 275px;
      height: 275px;

      object-fit: contain;

      position: relative;

      z-index: 2;

      filter:
        drop-shadow(
          0 20px 30px
          rgba(0,0,0,.3)
        );
    }


    .hero-stats {

      display: flex;

      gap: 45px;

      margin-top: 60px;

      flex-wrap: wrap;
    }


    .stat strong {

      display: block;

      font-size: 27px;

      color: white;
    }


    .stat span {

      display: block;

      margin-top: 3px;

      color: #747b81;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .7px;
    }


    /* =====================================================
       SECTION GENERAL
    ===================================================== */

    section {

      padding: 100px 0;
    }


    .section-top {

      margin-bottom: 50px;

      max-width: 680px;
    }


    .section-label {

      color: #a47a00;

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 10px;
    }


    .section-title {

      font-size:
        clamp(32px,4vw,48px);

      line-height: 1.1;

      letter-spacing: -1.5px;

      margin-bottom: 15px;
    }


    .section-description {

      color: #73797f;

      font-size: 15px;

      line-height: 1.8;
    }


    /* =====================================================
       ABOUT
    ===================================================== */

    .about {

      background: white;
    }


    .about-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 70px;

      align-items: center;
    }


    .about-image {

      min-height: 500px;

      border-radius: 25px;

      background:

        linear-gradient(
          135deg,
          #171a1d,
          #0d0f10
        );

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      overflow: hidden;
    }


    .about-image::after {

      content: "R2";

      position: absolute;

      right: -30px;

      bottom: -90px;

      font-size: 270px;

      line-height: 1;

      font-weight: 900;

      color:
        rgba(245,184,0,.06);
    }


    .about-image img {

      width: 250px;
      height: 250px;

      object-fit: contain;

      position: relative;

      z-index: 2;
    }


    .about-content h3 {

      font-size: 30px;

      line-height: 1.2;

      margin-bottom: 18px;
    }


    .about-content p {

      color: #747a80;

      font-size: 14px;

      line-height: 1.85;

      margin-bottom: 16px;
    }


    .about-points {

      display: grid;

      gap: 12px;

      margin-top: 25px;
    }


    .about-point {

      display: flex;

      gap: 12px;

      align-items: flex-start;
    }


    .check {

      width: 24px;
      height: 24px;

      flex: 0 0 24px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        #fff3c8;

      color:
        #a47a00;

      font-size: 12px;

      font-weight: 900;
    }


    .about-point span {

      font-size: 14px;

      font-weight: 700;

      color: #35393d;
    }


    /* =====================================================
       SERVICES
    ===================================================== */

    .services {

      background:
        #f5f6f7;
    }


    .service-grid {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 20px;
    }


    .service-card {

      padding: 32px;

      background: white;

      border:
        1px solid #e5e7e9;

      border-radius:
        var(--radius);

      transition: .3s;
    }


    .service-card:hover {

      transform:
        translateY(-7px);

      box-shadow:
        var(--shadow);

      border-color:
        var(--yellow);
    }


    .service-icon {

      width: 58px;
      height: 58px;

      border-radius: 13px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        #fff4cf;

      font-size: 26px;

      margin-bottom: 22px;
    }


    .service-card h3 {

      font-size: 19px;

      margin-bottom: 9px;
    }


    .service-card p {

      color: #7a8085;

      font-size: 13px;

      line-height: 1.8;
    }


    /* =====================================================
       EQUIPMENT
    ===================================================== */

    .equipment {

      background: white;
    }


    .equipment-grid {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 22px;
    }


    .equipment-card {

      background:
        #151719;

      color: white;

      border-radius:
        18px;

      overflow: hidden;

      transition: .3s;

      border:
        1px solid #272b2f;
    }


    .equipment-card:hover {

      transform:
        translateY(-7px);

      box-shadow:
        0 25px 50px rgba(0,0,0,.15);
    }


    .equipment-top {

      height: 220px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:

        radial-gradient(
          circle,
          rgba(245,184,0,.14),
          transparent 55%
        ),

        linear-gradient(
          135deg,
          #25292d,
          #101214
        );

      font-size: 75px;
    }


    .equipment-body {

      padding: 25px;
    }


    .equipment-category {

      color:
        var(--yellow);

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1.5px;

      font-weight: 900;
    }


    .equipment-body h3 {

      font-size: 22px;

      margin:
        6px 0 9px;
    }


    .equipment-body p {

      color: #92989d;

      font-size: 13px;

      line-height: 1.7;

      margin-bottom: 20px;
    }


    .equipment-button {

      display: block;

      padding: 11px;

      text-align: center;

      background:
        #24282b;

      color: white;

      border-radius: 7px;

      font-size: 12px;

      font-weight: 800;

      transition: .25s;
    }


    .equipment-button:hover {

      background:
        var(--yellow);

      color: #111;
    }


    /* =====================================================
       WHY R2
    ===================================================== */

    .why {

      background:
        #f5f6f7;
    }


    .why-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 60px;

      align-items: center;
    }


    .why-list {

      display: grid;

      gap: 25px;
    }


    .why-item {

      display: flex;

      gap: 16px;
    }


    .why-icon {

      width: 48px;
      height: 48px;

      min-width: 48px;

      border-radius: 11px;

      background:
        #fff1bf;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 20px;
    }


    .why-item h3 {

      font-size: 17px;

      margin-bottom: 4px;
    }


    .why-item p {

      color: #777d82;

      font-size: 13px;

      line-height: 1.7;
    }


    .why-panel {

      background:
        #111315;

      color: white;

      padding: 50px;

      border-radius: 22px;

      position: relative;

      overflow: hidden;
    }


    .why-panel::after {

      content: "";

      position: absolute;

      width: 260px;
      height: 260px;

      border-radius: 50%;

      background:
        rgba(245,184,0,.08);

      right: -100px;

      bottom: -100px;
    }


    .why-panel h3 {

      font-size: 31px;

      line-height: 1.2;

      max-width: 430px;

      position: relative;

      z-index: 2;
    }


    .why-panel p {

      color: #aeb3b7;

      max-width: 430px;

      margin-top: 17px;

      font-size: 14px;

      line-height: 1.8;

      position: relative;

      z-index: 2;
    }


    /* =====================================================
       PROCESS
    ===================================================== */

    .process {

      background: white;
    }


    .process-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 18px;
    }


    .process-card {

      padding: 30px 24px;

      border:
        1px solid #e5e7e9;

      border-radius:
        14px;

      background: white;

      position: relative;
    }


    .process-number {

      font-size: 38px;

      font-weight: 900;

      color:
        var(--yellow);

      margin-bottom: 15px;
    }


    .process-card h3 {

      font-size: 16px;

      margin-bottom: 7px;
    }


    .process-card p {

      color: #777d82;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =====================================================
       PROJECT SUPPORT
    ===================================================== */

    .support {

      background:
        #111315;

      color: white;
    }


    .support-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 70px;

      align-items: center;
    }


    .support h2 {

      font-size:
        clamp(32px,4vw,52px);

      line-height: 1.08;

      letter-spacing: -1.5px;

      margin-bottom: 18px;
    }


    .support h2 span {

      color:
        var(--yellow);
    }


    .support p {

      color: #aeb3b7;

      max-width: 600px;

      font-size: 14px;

      line-height: 1.85;
    }


    .support-box {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }


    .support-stat {

      padding: 25px;

      border:
        1px solid rgba(255,255,255,.1);

      border-radius: 12px;

      background:
        rgba(255,255,255,.025);
    }


    .support-stat strong {

      display: block;

      font-size: 27px;

      color:
        var(--yellow);
    }


    .support-stat span {

      color: #90969b;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .8px;
    }


    /* =====================================================
       CTA
    ===================================================== */

    .cta {

      padding: 90px 0;

      background:
        var(--yellow);

      color: #111;

      text-align: center;
    }


    .cta h2 {

      font-size:
        clamp(32px,4vw,52px);

      line-height: 1.1;

      margin-bottom: 12px;
    }


    .cta p {

      max-width: 650px;

      margin:
        0 auto 28px;

      color: #4d3e00;

      font-size: 14px;
    }


    .cta-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 52px;

      padding:
        0 25px;

      border-radius: 8px;

      background:
        #111315;

      color: white;

      font-weight: 800;

      font-size: 14px;

      transition: .25s;
    }


    .cta-button:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 15px 30px rgba(0,0,0,.18);
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {

      background:
        #090a0b;

      color: white;

      padding:
        65px 0 25px;
    }


    .footer-grid {

      display: grid;

      grid-template-columns:
        2fr 1fr 1fr;

      gap: 60px;

      padding-bottom: 45px;
    }


    .footer-brand {

      display: flex;

      align-items: center;

      gap: 13px;

      margin-bottom: 20px;
    }


    .footer-logo {

      width: 60px;
      height: 60px;

      object-fit: contain;
    }


    .footer-brand h3 {

      font-size: 18px;
    }


    .footer-brand span {

      color: #777d82;

      font-size: 10px;

      letter-spacing: 1px;
    }


    .footer-about {

      max-width: 430px;

      color: #777d82;

      font-size: 13px;

      line-height: 1.8;
    }


    footer h4 {

      font-size: 13px;

      margin-bottom: 18px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }


    footer a {

      display: block;

      color: #777d82;

      font-size: 13px;

      margin-bottom: 9px;

      transition: .2s;
    }


    footer a:hover {

      color:
        var(--yellow);
    }


    .copyright {

      border-top:
        1px solid #202326;

      padding-top: 20px;

      color: #555b60;

      font-size: 11px;
    }


    /* =====================================================
       FLOATING WHATSAPP
    ===================================================== */

    .floating-wa {

      position: fixed;

      right: 20px;
      bottom: 20px;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background:
        #25d366;

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size:
